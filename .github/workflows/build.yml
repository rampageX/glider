name: Build
on:
  push:
    branches:
      - "dev"
      - "release/v*"
    tags:
      - "*"
  pull_request:

permissions:
  contents: write

env:
  APP_NAME: glider
  DOCKERHUB_REPO: nadoo/glider
  GHCR_REPO: ghcr.io/nadoo/glider
  PLATFORMS: linux/386,linux/amd64,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Vars
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: true

      - name: Test
        run: go test -tags with_utls -v ./...

      # Release branches must point at main. The repository-scoped Actions token
      # creates the tag, and this same job publishes (token pushes do not trigger
      # another workflow). Tag pushes remain supported for normal CLI releases.
      - name: Prepare release tag
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "version = \"${tag#v}\"" main.go
          test -f "docs/releases/$tag.md"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build
        uses: goreleaser/goreleaser-action@v7
        if: "!startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/v')"
        with:
          args: build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: "!startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/v')"
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-dev-${{ env.SHA_SHORT }}
          path: |
            ./dist/linux_linux_amd64_v4/${{ env.APP_NAME }}
            ./dist/windows_windows_amd64_v4/${{ env.APP_NAME }}.exe

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v')
        with:
          args: release --clean --release-notes docs/releases/${{ env.RELEASE_TAG }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Binaries To Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v')
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            ./dist/linux_linux_amd64_v4/${{ env.APP_NAME }}
            ./dist/windows_windows_amd64_v4/${{ env.APP_NAME }}.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
