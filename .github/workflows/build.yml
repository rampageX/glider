name: Build
on:
  push:
    branches:
      - "dev"
    tags:
      - "*"
  pull_request:

permissions:
  contents: write

env:
  APP_NAME: glider
  DOCKERHUB_REPO: nadoo/glider
  GHCR_REPO: ghcr.io/nadoo/glider
  PLATFORMS: linux/386,linux/amd64,linux/arm/v5,linux/arm/v6,linux/arm/v7,linux/arm64,linux/riscv64

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Vars
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: "go.mod"
          cache: true

      - name: Test
        run: go test -v ./...

      - name: Build
        uses: goreleaser/goreleaser-action@v7
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          args: build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-dev-${{ env.SHA_SHORT }}
          path: |
            ./dist/linux_linux_amd64_v4/${{ env.APP_NAME }}
            ./dist/windows_windows_amd64_v4/${{ env.APP_NAME }}.exe

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Binaries To Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ./dist/linux_linux_amd64_v4/${{ env.APP_NAME }}
            ./dist/windows_windows_amd64_v4/${{ env.APP_NAME }}.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
